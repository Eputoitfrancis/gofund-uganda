<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Campaign - GoFund Uganda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav>
        <h1>GoFund Uganda</h1>
        {% if session.get('user_id') %}
            <span>Welcome, {{ session['username'] }}!</span>
            <a href="/dashboard">Dashboard</a>
            <a href="/campaigns">Campaigns</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </nav>

    <div class="form-container">
        <h2>Start a Campaign</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="error">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
        <form method="POST" action="/campaigns/new" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Campaign Title" required>
            <textarea name="description" placeholder="Describe your campaign" rows="4" required></textarea>
            <input type="number" name="goal" placeholder="Fundraising Goal (UGX)" required>
            <label style="text-align:left; display:block; margin:8px 0; color:#666;">Campaign Image (optional)</label>
            <input type="file" name="image" accept="image/*">
            <button type="submit">Create Campaign</button>
        </form>
    </div>

</body>
</html>
